services:

  backend:
    build:
      context: ./backend
    container_name: prescripto-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker
    depends_on:
       mongodb:
         condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:5000
    container_name: prescripto-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        VITE_BACKEND_URL: http://localhost:5000
    container_name: prescripto-admin
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: prescripto-mongodb
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped


volumes:
  mongodb_data: